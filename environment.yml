name: tankbind_py38
channels:
  - conda-forge
  - milagraph
  - pyg
  - pytorch
dependencies:
  - biopython
  - cpuonly
  - freesasa  # so pip doesnt compile from source
  - rdkit
  - h5py  # Binary instead of compiling
  - mkl<2024 # 2024.1 Removes symbol iJIT_NotifyEvent, that breaks import torch
  - pip
  - pyg=2.1.0
  - python=3.8
  - gxx_linux-64
  - ninja
  - python-lmdb # PIP would require 'patch' do budowy py-lmdb
  - pytorch=1.13.1
  - torchdrug=0.1.2
  - pip:
    - atom3d==0.2.6
    - torchmetrics==1.5.2
